name: "Compilar La Cueva MultiStream Plugin"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: "Compilar Instalador para Windows"
    runs-on: windows-latest

    steps:
      - name: "Descargar Código Fuente"
        uses: actions/checkout@v4

      - name: "Instalar Framework Qt 6"
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          cache: false

      - name: "Descargar Headers oficiales de OBS Studio"
        shell: pwsh
        run: |
          Write-Host "Clonando headers de OBS Studio v30.1.2..."
          git clone --depth 1 --branch 30.1.2 https://github.com/obsproject/obs-studio.git C:/obs-studio-src
          Write-Host "Headers listos."

      - name: "Descargar Binarios oficiales de OBS Studio"
        shell: pwsh
        run: |
          Write-Host "Descargando binarios precompilados..."
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/30.1.2/OBS-Studio-30.1.2.zip" -OutFile "obs.zip"
          Expand-Archive -Path "obs.zip" -DestinationPath "C:/obs-studio-bin"
          Write-Host "Binarios listos en C:/obs-studio-bin"

      - name: "Generar Librerias de Enlace para MSVC (.lib)"
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $libTool = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "lib.exe" -Recurse | Where-Object { $_.FullName -like "*\x64\lib.exe" } | Select-Object -First 1 -ExpandProperty FullName

          $binDir = "C:\obs-studio-bin\bin\64bit"

          # Generar obs.lib
          & $dumpbin /EXPORTS "$binDir\obs.dll" | Out-File -Encoding ascii "$binDir\obs.exports"
          $lines = @("EXPORTS")
          Get-Content "$binDir\obs.exports" | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') {
                  $lines += $matches[1]
              }
          }
          $lines | Set-Content -Encoding ascii "$binDir\obs.def"
          & $libTool /def:"$binDir\obs.def" /out:"$binDir\obs.lib" /machine:x64

          # Generar obs-frontend-api.lib
          & $dumpbin /EXPORTS "$binDir\obs-frontend-api.dll" | Out-File -Encoding ascii "$binDir\frontend.exports"
          $lines = @("EXPORTS")
          Get-Content "$binDir\frontend.exports" | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') {
                  $lines += $matches[1]
              }
          }
          $lines | Set-Content -Encoding ascii "$binDir\obs-frontend-api.def"
          & $libTool /def:"$binDir\obs-frontend-api.def" /out:"$binDir\obs-frontend-api.lib" /machine:x64

          Write-Host "Librerias obs.lib y obs-frontend-api.lib generadas con exito."

      - name: "Configurar con CMake"
        shell: pwsh
        run: |
          if (Test-Path "build") {
              Remove-Item -Path "build" -Recurse -Force
          }
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR="${{ env.Qt6_DIR }}/lib/cmake/Qt6" `
            -DOBS_SRC_DIR="C:/obs-studio-src" `
            -DOBS_BIN_DIR="C:/obs-studio-bin/bin/64bit"

      - name: "Compilar DLL del Plugin"
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: "Localizar y Preparar Archivos DLL"
        shell: pwsh
        run: |
          $dllFile = Get-ChildItem -Path "build" -Filter "lacueva-multistream.dll" -Recurse | Select-Object -First 1
          if (-not $dllFile) {
              Write-Host "Error: No se encontró la DLL compilada."
              exit 1
          }
          Write-Host "DLL compilada con éxito en: $($dllFile.FullName)"
          Copy-Item $dllFile.FullName "lacueva-multistream.dll" -Force

      - name: "Instalar Herramienta NSIS"
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Write-Host "NSIS instalado en el runner."

      - name: "Generar Instalador Automático .exe (NSIS)"
        shell: pwsh
        run: |
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) {
              $nsisExe = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          }
          & $nsisExe installer/installer.nsi
          Write-Host "Instalador generado con éxito."

      - name: "Generar Paquete ZIP Portátil de Respaldo"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "dist/data/obs-plugins/lacueva-multistream" -Force
          Copy-Item "lacueva-multistream.dll" "dist/obs-plugins/64bit/"
          Copy-Item "data/locale" "dist/data/obs-plugins/lacueva-multistream/" -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath "LaCuevaMultiStream_Manual_x64.zip" -Force
          Write-Host "ZIP portable creado con éxito."

      - name: "Publicar Instalador Propio de La Cueva"
        uses: actions/upload-artifact@v4
        with:
          name: LaCuevaMultiStream_Instalador_x64
          path: |
            LaCuevaMultiStream_Installer_x64.exe
            LaCuevaMultiStream_Manual_x64.zip
            lacueva-multistream.dll
